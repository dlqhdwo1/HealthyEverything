<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - HealthyEverything</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c5a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            padding: 48px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo a {
            font-size: 28px;
            font-weight: 700;
            color: #ff6b35;
            text-decoration: none;
        }

        .logo p {
            color: #888;
            margin-top: 8px;
            font-size: 14px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #333;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            margin-top: 12px;
        }

        .btn-submit:hover {
            background: #e55a2b;
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 28px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 16px;
            color: #888;
            font-size: 14px;
            position: relative;
        }

        .login-link {
            text-align: center;
        }

        .login-link a {
            color: #ff6b35;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #060;
            border: 1px solid #cfc;
        }

        #message {
            display: none;
        }
    </style>
</head>
<body>

<div class="signup-container">
    <div class="logo">
        <a href="/">HealthyEverything</a>
        <p>건강한 변화의 시작</p>
    </div>

    <h1>회원가입</h1>

    <div id="message" class="alert"></div>

    <form id="signupForm">
        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="8자 이상 입력해주세요" required minlength="8">
        </div>

        <div class="form-group">
            <label for="confirmPassword">비밀번호 확인</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="비밀번호를 다시 입력해주세요" required>
        </div>

        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" placeholder="홍길동" required>
        </div>

        <button type="submit" class="btn-submit">가입하기</button>
    </form>

    <div class="divider">
        <span>또는</span>
    </div>

    <div class="login-link">
        이미 계정이 있으신가요? <a href="/login">로그인</a>
    </div>
</div>

<script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const name = document.getElementById('name').value;
        const messageDiv = document.getElementById('message');

        // 비밀번호 확인
        if (password !== confirmPassword) {
            messageDiv.className = 'alert alert-error';
            messageDiv.textContent = '비밀번호가 일치하지 않습니다.';

            messageDiv.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('/api/auth/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    userid: email,
                    password: password,
                    name: name
                })
            });

            const data = await response.json();

            if (response.ok) {
                messageDiv.className = 'alert alert-success';
                messageDiv.textContent = '회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.';
                messageDiv.style.display = 'block';

                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                messageDiv.className = 'alert alert-error';
                if (data.code === 'DUPLICATE_EMAIL') {
                    messageDiv.textContent = '이미 사용 중인 이메일입니다.';
                } else {
                    messageDiv.textContent = data.message || '회원가입에 실패했습니다.';
                }
                messageDiv.style.display = 'block';
            }
        } catch (error) {
            messageDiv.className = 'alert alert-error';
            messageDiv.textContent = '서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
            messageDiv.style.display = 'block';
        }
    });
</script>

</body>
</html>
